<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b6a2"/>
      <stop offset=".34" stop-color="#e8c9a4"/>
      <stop offset=".56" stop-color="#f6dcb4"/>
      <stop offset=".72" stop-color="#f3d1a0"/>
      <stop offset="1" stop-color="#b98f63"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".28" stop-color="#ffeec9" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#ffd99a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7a279"/><stop offset="1" stop-color="#a98562"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c7a59"/><stop offset="1" stop-color="#7a5d43"/></linearGradient>
    <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f4a37"/><stop offset="1" stop-color="#2f2319"/></linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf2" stop-opacity=".95"/><stop offset="1" stop-color="#f1dcc0" stop-opacity=".55"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .38  0 0 0 .16 0"/></filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#sky)"/>
  <circle cx="640" cy="760" r="520" fill="url(#sun)"/>
  <circle cx="640" cy="780" r="92" fill="#fffdf6" filter="url(#soft)"/>
  <g filter="url(#softer)" opacity=".5">
    <ellipse cx="220" cy="420" rx="330" ry="46" fill="#fff4e2"/>
    <ellipse cx="930" cy="300" rx="380" ry="40" fill="#fff0da"/>
    <ellipse cx="720" cy="560" rx="300" ry="30" fill="#ffe7c4"/>
  </g>
  <path d="M0 930 C160 860 300 900 440 880 C600 856 700 800 860 840 C1000 874 1100 842 1200 860 V1500 H0Z" fill="url(#h1)" opacity=".8" filter="url(#bokeh)"/>
  <path d="M0 1030 C140 980 280 1010 420 990 C560 970 660 930 800 960 C940 990 1080 950 1200 980 V1500 H0Z" fill="url(#h2)" opacity=".92"/>
  <!-- wedding arch with draped fabric -->
  <g>
    <path d="M430 1210 V640 A170 170 0 0 1 770 640 V1210" fill="none" stroke="#3a2a1d" stroke-width="13" stroke-linecap="round"/>
    <path d="M432 660 C470 560 560 470 606 470 C560 560 520 720 500 900 C488 1010 470 1120 446 1206 Z" fill="url(#veil)"/>
    <path d="M768 660 C742 570 668 476 606 470 C650 540 690 700 716 900 C728 1000 744 1110 760 1206 Z" fill="url(#veil)" opacity=".85"/>
    <g fill="#f4e6d2">
      <circle cx="520" cy="520" r="34"/><circle cx="566" cy="486" r="40"/><circle cx="622" cy="474" r="38"/><circle cx="676" cy="496" r="36"/><circle cx="716" cy="536" r="30"/>
    </g>
    <g fill="#d9b48e"><circle cx="544" cy="508" r="22"/><circle cx="600" cy="488" r="24"/><circle cx="654" cy="500" r="21"/><circle cx="700" cy="528" r="17"/></g>
    <g fill="#7d8a63" opacity=".9">
      <ellipse cx="488" cy="556" rx="30" ry="11" transform="rotate(-48 488 556)"/><ellipse cx="742" cy="570" rx="30" ry="11" transform="rotate(52 742 570)"/>
      <ellipse cx="548" cy="456" rx="26" ry="10" transform="rotate(-24 548 456)"/><ellipse cx="672" cy="458" rx="26" ry="10" transform="rotate(22 672 458)"/>
    </g>
  </g>
  <path d="M0 1190 C200 1150 420 1190 600 1180 C800 1170 1000 1140 1200 1170 V1500 H0Z" fill="url(#h3)"/>
  <g fill="#ffe9bf" filter="url(#bokeh)">
    <circle cx="150" cy="1120" r="26" opacity=".5"/><circle cx="270" cy="1010" r="16" opacity=".55"/><circle cx="1010" cy="1090" r="30" opacity=".45"/>
    <circle cx="930" cy="960" r="15" opacity=".5"/><circle cx="1110" cy="1210" r="20" opacity=".4"/><circle cx="90" cy="1290" r="18" opacity=".35"/>
    <circle cx="340" cy="1320" r="24" opacity=".3"/><circle cx="860" cy="1340" r="22" opacity=".3"/>
  </g>
  <rect width="1200" height="1500" filter="url(#grain)" opacity=".7"/>
</svg>
